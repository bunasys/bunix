# bunix (Buna Linux) -- an FHS system built from source with BuildStream.
#
# Layout: the UAPI.9 Linux File System Hierarchy, with multiarch $libdir
# (/usr/lib/x86_64-linux-gnu).  The toolchain is bootstrapped here, from a
# binary seed, in elements/bootstrap/.
name: bunix
min-version: 2.0
element-path: elements

# Where sources come from.  Tarballs are pinned by checksum, so a mirror can
# only serve the same bytes.
aliases:
  gnu: https://mirrors.kernel.org/gnu/
  kernel: https://cdn.kernel.org/pub/
  kernel-git: https://git.kernel.org/pub/scm/
  github: https://github.com/
  python: https://www.python.org/ftp/python/
  cpan: https://www.cpan.org/src/5.0/
  astron: https://astron.com/pub/
  rust: https://static.rust-lang.org/
  crates: https://static.crates.io/crates/
  pypi: https://files.pythonhosted.org/packages/
  sourceforge: https://downloads.sourceforge.net/project/
  curl: https://curl.se/
  dbus: https://dbus.freedesktop.org/releases/
  isc: https://downloads.isc.org/isc/
  libuv: https://dist.libuv.org/dist/
  lttng: https://lttng.org/files/
  busybox: https://busybox.net/downloads/
  greenwood: https://www.greenwoodsoftware.com/
  pkgconf: https://distfiles.ariadne.space/pkgconf/
  lua: https://www.lua.org/ftp/
  sourceware: https://sourceware.org/pub/
  snapshot: https://snapshot.debian.org/archive/debian/
  rpm: https://ftp.osuosl.org/pub/rpm/
  botan: https://botan.randombit.net/releases/
  sqlite: https://sqlite.org/
  gnome: https://download.gnome.org/sources/
  thrysoee: https://thrysoee.dk/
  swift: https://download.swift.org/
  freedesktop: https://www.freedesktop.org/software/
  openbsd: https://cdn.openbsd.org/pub/OpenBSD/
  netfilter: https://www.netfilter.org/projects/
  freedesktop-dri: https://dri.freedesktop.org/
  xorg: https://www.x.org/releases/
  google-fonts: https://raw.githubusercontent.com/google/fonts/
  chromium: https://commondatastorage.googleapis.com/chromium-browser-official/
  golang: https://go.dev/dl/

mirrors:
- name: gnu-origin
  aliases:
    gnu:
    - https://ftp.gnu.org/gnu/

plugins:
- origin: pip
  package-name: buildstream-plugins
  sources: [docker, git, patch]
  elements: [autotools, make, cmake, meson]
- origin: pip
  package-name: buildstream-plugins-community
  sources: [cargo2, pypi]
  elements: [cargo]

options:
  arch:
    type: arch
    description: Machine architecture to build for
    values: [x86_64]

variables:
  # Multiarch tuple: names $libdir, as the UAPI hierarchy recommends.  It is
  # also the final system's GNU triplet (as on Debian).
  triplet: x86_64-linux-gnu
  libdir: "%{prefix}/lib/%{triplet}"

  # Bootstrap only.  The cross triplet's vendor field differs from the seed's
  # (x86_64-pc-linux-gnu), so stages 1 and 2 truly cross-compile and cannot
  # pick up anything from the seed by accident.  Cross tools live in /tools,
  # the target system being assembled lives in /sysroot.
  cross-triplet: x86_64-bunix-linux-gnu
  seed-triplet: x86_64-pc-linux-gnu
  tools: /tools
  sysroot: /sysroot
  gcc-version: 16.2.0
  glibc-version: "2.44"

  # The oldest kernel glibc supports.  Below 5.8 it keeps fallbacks for system
  # calls newer kernels added -- which matters because builds run under
  # Rosetta, and Rosetta does not translate some of them (faccessat2: without
  # the fallback, `test -x /` is false and every configure script rejects the
  # shell).  On real hardware glibc still uses the new calls.
  glibc-min-kernel: "5.4"

environment:
  LC_ALL: C
  TZ: UTC
  # %{max-jobs} makes this part of every cache key: tools/bst-remote.sh
  # pins it (8) on every host, so the keys, and the caches, can be shared
  MAKEFLAGS: -j%{max-jobs}

# The system's elements (everything outside bootstrap/) build with the
# settings in include/system.yml.  They are applied here per build-system
# kind, and included directly by system elements of kind `manual`.  (They are
# not project-wide variables: those are part of every element's cache key, and
# changing them would rebuild the bootstrap.)
elements:
  autotools:
    (@): include/system.yml
    variables:
      # .la files record absolute paths that only mislead later builds
      remove-libtool-modules: "true"
      remove-libtool-libraries: "true"
  make:
    (@): include/system.yml
  meson:
    (@): include/system.yml
    variables:
      # plain: take the flags from the environment; nodownload: subprojects
      # must come from the element's sources, never the network
      meson-global: --buildtype=plain --wrap-mode=nodownload
  cmake:
    (@): include/system.yml
    variables:
      # None: take the flags from the environment, add no -O3/-g of its own
      cmake-global: -DCMAKE_BUILD_TYPE=None
  cargo:
    (@): include/system.yml
    environment:
      # crates come from the element's cargo2 source, never the network
      CARGO_NET_OFFLINE: "true"
