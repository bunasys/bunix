# A root in memory (root=tmpfs, the live stick's) has no partition to
# make or grow, and no disk of its own to look for one on: the stick's
# partitions are the release's /usr, and any other disk is the one to be
# installed to.  Its top is made by bunix-root-in-memory.service.
[Unit]
ConditionKernelCommandLine=!root=tmpfs
