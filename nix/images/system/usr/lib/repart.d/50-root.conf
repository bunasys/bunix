# The writable root partition of a system on a disk (/etc, /var, /home),
# after files/rootfs's: made by systemd-repart on the first boot, in the
# space the disk has left, and grown to fill it.  It runs in what starts
# the system (images/initrd.nix), and reads this from the /usr that is to
# be started, not from its own.
#
# ext4: going back to the system before an update is the job of the two
# /usr slots, not of the file system (docs/updates.md).  FactoryReset:
# `systemd-repart --factory-reset` makes it anew, empty.
#
# For a disk that is bunix's alone.  repart knows a root partition by its
# type: on a disk shared with another system it would take that system's
# for this one, and grow whichever it takes into the space beside it.
# There, what installs bunix makes every partition itself, the slots
# first, and this finds nothing to do.
[Partition]
Type=root
Format=ext4
# the name the kernel's command line asks for (images/uki.nix)
Label=bunix-root
FactoryReset=yes
SizeMinBytes=1G
# The links a UAPI.9 root has at its top: the new file system is empty,
# and the system handed over to runs /sbin/init.  (No /lib64: only x86
# asks for its loader there.)
MakeSymlinks=/bin:usr/bin /sbin:usr/bin /lib:usr/lib
# What is mounted on, and the journal's directory, without which the
# journal stays in memory.  Not /root: systemd makes it, for root alone.
MakeDirectories=/usr /etc /var /var/log/journal /home /srv /tmp
