# The journal is kept on a disk where the machine has one for /var, so
# that the log of a boot that went wrong can be read after the next; and
# in memory, little of it, where it has not (files/rootfs's says
# persistent, for a system that always has a disk).  auto: on disk if
# /var/log/journal is there.
[Journal]
Storage=auto
SystemMaxUse=256M
RuntimeMaxUse=16M
