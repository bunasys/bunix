# Merge only extension images whose root hash is signed by a key this
# system takes (usr/lib/verity.d).  systemd's default also accepts
# unsigned and unprotected images.  The line is files/rootfs's; there
# the kernel's built-in key is the only one.
#
# Of images: a directory that root puts where extensions are looked for
# is merged as it is.
[SysExt]
ImagePolicy=root=signed+absent:usr=signed+absent
