# A root in memory (root=tmpfs, the live stick's: images/live.nix) has no
# partition to make or grow.  With such a root, repart takes the disk /usr
# is on for the one to look at -- the stick -- and would make a root
# partition in its free space, which an installed system's kernel image
# (root=PARTLABEL=bunix-root) could then start in place of its own.  The
# initrd keeps it away the same (images/initrd/).
[Unit]
ConditionKernelCommandLine=!root=tmpfs
