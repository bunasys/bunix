# On a machine's first boot from a disk /etc is empty, and sysusers makes
# root before anything else is copied there.  It would make root's
# password locked, and sshd, without PAM, lets no key in for an account
# that is; so it is told root's password field, which is that of
# etc/shadow here: none, and not locked.
[Service]
SetCredential=passwd.hashed-password.root:*
