# Before extensions are merged, which of them: the ones of the version
# that runs (usr/lib/bunix/extensions-of-this-version says why that is
# not systemd's own choice).  And the unit runs when there are any where
# bunix keeps them, not only where systemd looks.
[Unit]
ConditionDirectoryNotEmpty=|/var/lib/bunix/extensions

[Service]
ExecStartPre=/usr/lib/bunix/extensions-of-this-version
# A socket an extension brings (Nix's daemon) is wanted by sockets.target,
# which systemd had planned, or reached, before the extension was there:
# asked again, it starts what is new.  (Not waited for: at boot it comes
# after this unit.)
ExecStartPost=/usr/bin/systemctl start --no-block sockets.target
