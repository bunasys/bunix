# Before extensions are merged, which of them: the ones of the version
# that runs (usr/lib/bunix/extensions-of-this-version says why that is
# not systemd's own choice).  And the unit runs when there are any where
# bunix keeps them, not only where systemd looks.
[Unit]
ConditionDirectoryNotEmpty=|/var/lib/bunix/extensions

[Service]
ExecStartPre=/usr/lib/bunix/extensions-of-this-version
# The system bus's policies an extension brings (accountsservice's), which
# say who may own a service's name: the bus reads them again, or such a
# service cannot take its name, and ends.  First: systemd starts the
# extension's upheld services as soon as it has read their units, which
# the merge has it do.  `-`: at boot the bus does not run yet, and reads
# them when it starts.
ExecStartPost=-/usr/bin/busctl call org.freedesktop.DBus /org/freedesktop/DBus org.freedesktop.DBus ReloadConfig
# polkit's rules and actions an extension brings (upower's: that it may
# power the machine off past inhibitors when the battery is empty).
# polkitd watches its directories for changes, and an extension laid
# over /usr is none it sees: it is started again, if it runs.  At boot it
# does not run yet, and reads them when it starts.
ExecStartPost=-/usr/bin/systemctl try-restart --no-block polkit.service
# A socket an extension brings (Nix's daemon) is wanted by sockets.target,
# which systemd had planned, or reached, before the extension was there:
# asked again, it starts what is new.  (Not waited for: at boot it comes
# after this unit.)
ExecStartPost=/usr/bin/systemctl start --no-block sockets.target
# udev's rules an extension brings (libinput's, for touchpads and
# tablets) are for devices that were there before it, too: udev reads
# its rules again, and goes over the input devices once more.  `-`: at
# boot udev may not run yet, and then its first pass over every device,
# which comes later, has the rules.
ExecStartPost=-/usr/bin/udevadm control --reload
ExecStartPost=-/usr/bin/udevadm trigger --action=change --subsystem-match=input
