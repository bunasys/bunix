# polkit's helper that checks a password is started for every connection
# to its socket, and any user may connect.  One that connects and says
# nothing makes the helper fail, and a failed unit is what marks a boot,
# and so an update, as bad (systemd-boot-check-no-failures.service).
# So a failed one is forgotten as a finished one is; the journal keeps
# what it said.  tools/vm-checks/run0.sh tries it.
[Unit]
CollectMode=inactive-or-failed
