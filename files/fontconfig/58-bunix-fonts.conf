<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Which fonts the generic names are on bunix (nix/desktop.nix, fonts).

     58-: read before fontconfig's own 60-latin.conf, and the first rule
     read wins.

     The Latin face comes first, then its Arabic companion.  Google's Noto
     Arabic fonts carry Latin letters too, so an Arabic font first would
     draw English in its Latin.  Arabic text still gets the Arabic font:
     a font the text's language needs (lang=ar) wins over these, which
     only prefer; and a letter Noto Sans or Noto Serif lacks is drawn by the
     next font in the list that has it.

     monospace: there is no monospaced Noto Arabic, so Arabic in it is
     Kawkab Mono's; Noto Sans Arabic after it has the letters Kawkab Mono
     lacks (Persian's and Urdu's, among them). -->
<fontconfig>
  <alias><family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Sans Arabic</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias><family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Naskh Arabic</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias><family>monospace</family>
    <prefer><family>Noto Sans Mono</family><family>Kawkab Mono</family><family>Noto Sans Arabic</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
