# The extension's /usr, read-only and compressed.  As systemd's own
# sysext.repart.d (systemd-repart --make-ddi=sysext), plus LZMA.
[Partition]
Type=root
Format=erofs
Compression=lzma
CopyFiles=/usr/
Verity=data
VerityMatchKey=root
Minimize=best
# validatefs records the mount point as an extended attribute, which the
# build sandbox's file system cannot store; sysext does not use it
AddValidateFS=no
