# An installed system's writable root partition (/etc, /var, /home):
# created by systemd-repart in the initrd on first boot, in the space the
# disk image leaves free, and grown to fill the disk.  ext4 -- rollback of
# the OS is the job of the two /usr slots, not of the file system
# (docs/updates.md).  FactoryReset: `systemd-repart --factory-reset` (or
# systemd.factory_reset=1) recreates it empty.
[Partition]
Type=root
Format=ext4
FactoryReset=yes
SizeMinBytes=1G
# The merged-/usr links the hierarchy (UAPI.9) puts at the top: the new
# file system is empty, and the switch to it runs /sbin/init.
MakeSymlinks=/bin:usr/bin /sbin:usr/bin /lib:usr/lib /lib64:usr/lib/x86_64-linux-gnu
MakeDirectories=/usr /etc /var /home /root /srv /tmp
