# timesyncd starts before the network has DNS, gives up on every server
# at once, and then waits ConnectionRetrySec (30 s by default) -- a network
# coming up meanwhile does not wake it.  TLS certificates and the update
# manifest's expiry date are checked against this clock, so retry sooner:
# the first sync lands seconds after the network does, not 40 s into boot.
[Time]
ConnectionRetrySec=5
