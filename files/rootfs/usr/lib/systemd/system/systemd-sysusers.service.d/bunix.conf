# sysusers runs only when /usr is newer than /etc (ConditionNeedsUpdate=),
# but every file in a bunix /usr has the same fixed timestamp (BuildStream's
# reproducible builds), so after an update it would never see the users a
# new release adds (tss, sshd, ...).  It is quick and changes nothing when
# the users exist: run it on every boot.  (An empty Condition resets them
# all; ConditionCredential= only added another reason to run.)
[Unit]
ConditionNeedsUpdate=
