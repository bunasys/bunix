# A shell on the serial port only when the boot entry put the console there,
# and only when the port exists: the kernel creates ttyS0 on every PC, and
# a port without hardware (UART type 0) cannot be opened -- the unit would
# fail and mark the system degraded.  ExecCondition skips it cleanly.
[Unit]
ConditionKernelCommandLine=console=ttyS0,115200

[Service]
ExecCondition=/usr/bin/sh -c 'test "$(cat /sys/class/tty/%i/type)" != 0'
