# Name resolution over DNS only.  LLMNR (a Windows-era local-name protocol)
# answers whoever replies first -- a well-known way to have a machine send
# its traffic, or its credentials, to an attacker on the same network --
# and mDNS replies cannot pass the firewall anyway (they come to a
# multicast address connection tracking cannot match).  Admins can turn
# either back on in /etc/systemd/resolved.conf.d/.
[Resolve]
LLMNR=no
MulticastDNS=no
