# bunix's kernel settings, after systemd's own (50-default.conf).  An admin
# overrides any of them with a file of the same name in /etc/sysctl.d/.

# Kernel addresses and the kernel log only for root (CAP_SYSLOG): both help
# exploits find their way
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
# BPF programs JIT-compiled with constant blinding (against JIT spraying)
net.core.bpf_jit_harden = 2
# ptrace only of a process's own descendants (Yama)
kernel.yama.ptrace_scope = 1
# no kexec into another kernel once booted (lockdown also refuses unsigned
# ones under Secure Boot)
kernel.kexec_load_disabled = 1
# line disciplines (old serial protocols, a source of kernel bugs) loaded
# only by root
dev.tty.ldisc_autoload = 0

# Routing tricks a client never needs: ICMP redirects, source routing
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Swap is zram (zram-swap): compressed memory, far cheaper to reach than a
# disk, so the kernel should prefer it to dropping file caches, and read it
# a page at a time.  (The values zram-generator recommends.)
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0
