# What Nix needs outside /usr, which is all an extension brings: its
# store, on the root file system, and its settings, where the machine
# has none of its own (nix.conf beside the factory copy says what they
# are).  The store's directory before anything asks the daemon: a client
# looks at it first, and would give up.
d /nix 0755 root root -
d /nix/store 1775 root root -
C /etc/nix/nix.conf - - - - /usr/share/factory/etc/nix/nix.conf
