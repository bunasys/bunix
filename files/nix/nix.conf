# Nix on bunix, as the devtools extension brings it: for building in a
# sandbox from pinned sources, which is what bunix itself is built by.
# Copied to /etc/nix/nix.conf where there is none; that copy is the
# machine's to change.

# Every build in a sandbox, or not at all.
sandbox = true
sandbox-fallback = false

# Builds run as users made up for each, not as accounts: the system has
# no nixbld users, and an extension cannot bring any that outlast it.
build-users-group =
auto-allocate-uids = true
experimental-features = auto-allocate-uids

# Nothing is taken from others' stores: what is in this one was built
# here.
substituters =

# The machine's administrators may build, and nobody else: the store is
# on the root file system, and a build may fill it.
allowed-users = @wheel
