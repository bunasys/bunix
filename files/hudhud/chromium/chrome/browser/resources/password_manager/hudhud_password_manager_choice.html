<style include="cr-shared-style shared-style">
  :host {
    display: block;
  }

  /* As a page, shown only when it replaces the password manager's page. */
  :host([full-page]) {
    box-sizing: border-box;
    flex: 1;
    overflow-y: auto;
    padding: 0 var(--cr-section-padding) 28px;
  }

  :host([full-page]:not([replaces-built-in])) {
    display: none;
  }

  :host([full-page]) #page {
    margin: 0 auto;
    max-width: var(--cr-centered-card-max-width);
  }

  /* On the Settings page, a section above its other settings. */
  :host(:not([full-page])) #choiceCard {
    margin-block-end: 28px;
  }

  #status {
    padding: 0 var(--cr-section-padding);
  }

  #statusButtons {
    display: flex;
    gap: 8px;
    padding-block-end: var(--cr-section-vertical-padding);
  }

  #choiceDescription {
    padding: var(--cr-section-vertical-padding) var(--cr-section-padding) 0;
  }

  cr-radio-group {
    display: block;
    padding: 0 var(--cr-section-padding);
  }

  cr-radio-button {
    min-height: var(--cr-section-min-height);
  }
</style>
<div id="page">
  <template is="dom-if" if="[[fullPage]]" restamp>
    <h1 id="statusTitle" class="page-title">
      [[getStatusTitle_(chosenManager_)]]
    </h1>
    <div id="status" class="card">
      <div class="cr-padded-text">
        [[getStatusDescription_(chosenManager_)]]
      </div>
      <template is="dom-if" if="[[chosenManager_]]" restamp>
        <template is="dom-if" if="[[getExtensionNote_(chosenManager_)]]">
          <div id="extensionNote" class="cr-padded-text cr-secondary-text">
            [[getExtensionNote_(chosenManager_)]]
          </div>
        </template>
        <div id="statusButtons">
          <cr-button id="openButton" class="action-button"
              on-click="onOpenClick_">
            [[getOpenButtonLabel_(chosenManager_)]]
          </cr-button>
        </div>
      </template>
      <div class="cr-padded-text cr-secondary-text">
        $i18n{hudhudPasswordManagerSavedPasswordsKept}
      </div>
    </div>
  </template>

  <h3 id="choiceTitle" class="page-title">$i18n{hudhudPasswordManagerTitle}</h3>
  <div id="choiceCard" class="card">
    <div id="choiceDescription" class="cr-secondary-text">
      $i18n{hudhudPasswordManagerChoiceDescription}
    </div>
    <cr-radio-group selected="[[choice_]]"
        on-selected-changed="onSelectedChanged_"
        aria-label="$i18n{hudhudPasswordManagerTitle}">
      <cr-radio-button name="builtin"
          label="$i18n{hudhudPasswordManagerBuiltIn}">
      </cr-radio-button>
      <template is="dom-repeat" items="[[managers_]]">
        <cr-radio-button name="[[item.id]]" label="[[item.name]]">
        </cr-radio-button>
      </template>
      <cr-radio-button name="off" label="$i18n{hudhudPasswordManagerOff}">
      </cr-radio-button>
    </cr-radio-group>
  </div>
</div>
