# The bunix release being built, for the elements that put it into the
# image and its extensions (system/rootfs.bst, sysext/*.bst):
#
#   (@): include/release.yml
#
# It becomes IMAGE_VERSION and SYSEXT_LEVEL in os-release, the version in
# update file names (gcc_<version>.raw), and the directory updates
# for this release are published in.  An extension built for one release is
# refused by every other, because the toolchain's C library must be the
# system's own.  (Not a project variable: those are in every cache key.)

variables:
  release-version: 0.1.25
