[package]
name = "buna-kiosk"
version = "0.1.0"
edition = "2024"
description = "bunix's kiosk compositor: one app, full screen, on aquamarine"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

# No crates: the shim is compiled by build.rs with the system's C++ compiler,
# and the event loop calls poll() directly

[profile.release]
lto = true
codegen-units = 1
