[package]
name = "buna-login"
version = "0.1.0"
edition = "2024"
description = "bunix's login screen: a greetd greeter in GTK 4"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
codegen-units = 1
