# nix.conf on the Fly build machine (README.md): as the x86 builder's
# (tools/nix-builder/home-store/nix.conf), with the store on the volume.
# Builds run as root, in a sandbox; there are no build users.
store = /data/nix-root
sandbox = true
sandbox-fallback = false
substituters =
experimental-features =
build-users-group =
max-jobs = 1
cores = 0
# Builds unpack and compile on the volume: the machine's own root file
# system is small, and reset on every start.  tools/nix-fly.sh empties it
# when it stops a build that was left running.
build-dir = /data/build-dirs

# /bin/sh for builds: nix/bootstrap/sh.nix's x86-64 result, which
# tools/nix-fly.sh copies in with every build's inputs.
#
# The compiler cache, on the volume, as /dev/ccache (docs/browser.md,
# "The compiler cache"; ../nix-builder/nix.conf says why /dev).
sandbox-paths = /bin/sh=/data/nix-root/nix/store/dh5lv0hb5hvnk8zsdwhpihbjmv2m18ga-sh? /dev/ccache=/data/ccache?
