# nix.conf on the Fly build machine (README.md): as the x86 builder's
# (tools/nix-builder/home-store/nix.conf), with the store on the volume.
# Builds run as root, in a sandbox; there are no build users.
store = /data/nix-root
sandbox = true
sandbox-fallback = false
substituters =
experimental-features =
build-users-group =
max-jobs = 1
cores = 0
# /bin/sh for builds: nix/sh.nix's x86-64 result, copied in with every
# build's inputs (tools/nix-fly.sh), by where it is on disk
sandbox-paths = /bin/sh=/data/nix-root/nix/store/dh5lv0hb5hvnk8zsdwhpihbjmv2m18ga-sh?
