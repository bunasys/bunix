# BuildStream's user configuration on the build host
# (~/.config/buildstream.conf, written by install.sh): every build there
# pulls from and pushes to the shared cache.  tools/bst-fly.sh writes the
# Fly machine's own, which pulls only (README.md).
artifacts:
  servers:
  - url: http://127.0.0.1:7981
    type: index
    push: true
  - url: http://127.0.0.1:7982
    type: storage
    push: true
