# BuildStream's user configuration on a machine that builds bunix
# (~/.config/buildstream.conf): every build pulls from and pushes to the
# shared cache.  On the build host itself the cache is local; other machines
# reach it through an SSH tunnel to the same ports (README.md).
artifacts:
  servers:
  - url: http://127.0.0.1:7981
    type: index
    push: true
  - url: http://127.0.0.1:7982
    type: storage
    push: true
