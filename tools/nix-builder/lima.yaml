# The aarch64-linux machine that Nix builds on, as a VM on an Apple Silicon
# Mac (macOS cannot run Linux builds itself):
#
#   limactl create --name=bunix-builder tools/nix-builder/lima.yaml
#   limactl start bunix-builder
#   limactl stop bunix-builder && limactl start bunix-builder   (once, see below)
#   limactl shell bunix-builder
#
# The first start installs Nix and puts the guest's user in the group that
# may talk to the Nix daemon; a login from before that does not have the
# group, and Lima keeps its login open until the VM stops.  Hence the one
# restart.
#
# The guest's distribution does not matter to what is built: every build
# runs in Nix's sandbox and sees only /nix/store.  Debian is here to carry a
# kernel and the Nix daemon, nothing else.
#
# Only the image comes from Lima's Debian template.  The template itself
# (template:debian-13) also mounts the Mac's whole home directory in the
# guest, and Lima adds mount lists together, so it cannot be used as a base.
base: template:_images/debian-13

# Apple's Virtualization.framework: the same CPU architecture as the Mac, so
# nothing is emulated.
vmType: vz
arch: aarch64

# Chromium (Hudhud, docs/browser.md) is built here for arm64: as many of
# the Mac's cores and as much of its memory as it can spare (an M2 Pro,
# 10 cores and 16 GB, leaving macOS 2 GB, enough while the Mac does
# little else), and a 16 GB swap file in the guest (provision, below) for
# its largest links.  A build takes the Mac
# for half a day.
cpus: 10
memory: 14GiB
# grows as it fills; this is the limit: Chromium's source and its build
# take over 100 GB
disk: 130GiB

# The repository, read-only, and nothing else of the Mac: derivations are
# evaluated from it in the guest, and a build cannot write back into it.
# The location is where this checkout is; change it for another.
mounts:
- location: "~/Projects/bunix/bunix"
  mountPoint: /bunix
  writable: false

# Lima installs containerd by default; nothing here uses containers.
containerd:
  system: false
  user: false

# Nix, from Debian's own package: built by Debian from source, so the store
# starts empty and holds only what is built here.  The package creates the
# nixbld users builds run as, and the nix-users group that may talk to the
# daemon.
provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v nix-build > /dev/null || {
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y nix-setup-systemd
    }
    install -m 644 /bunix/tools/nix-builder/nix.conf /etc/nix/nix.conf
    # nix.conf's build-dir
    mkdir -p /nix/var/nix/builds
    usermod -aG nix-users "{{.User}}"
    systemctl restart nix-daemon
    # swap for Chromium's largest links (above), made once
    if [ ! -f /swapfile ]; then
        fallocate -l 16G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
    fi
    grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
    swapon --show=NAME | grep -q '^/swapfile$' || swapon /swapfile
