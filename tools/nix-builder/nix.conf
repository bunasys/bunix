# /etc/nix/nix.conf of the builder VM; tools/nix-builder/lima.yaml installs
# it there when the VM starts.
#
# Nix is used here for two things only: builds that see nothing but their
# declared inputs, and a store addressed by the hash of those inputs.

# Every build runs in an empty file system holding /nix/store paths of its
# inputs, with no network.  No fallback: a build that cannot be sandboxed
# fails, it does not run unsandboxed.
sandbox = true
sandbox-fallback = false

# Nothing of the guest inside the sandbox, not even /bin/sh: a build's
# shell is one of its inputs.
sandbox-paths =

# No binary caches: the store fills only from what is built here.
substituters =

# The Nix language and nix-build, as they have been for years: no flakes,
# no `nix` subcommands.
experimental-features =

# Builds run as the nixbld users Debian's package created, never as root.
build-users-group = nixbld

# One derivation at a time, allowed every CPU of the VM ($NIX_BUILD_CORES;
# 0 means all).  Two at once would be two gcc builds' worth of compilers in
# the VM's 10 GiB.  Neither number is part of a derivation's hash.
max-jobs = 1
cores = 0
