# /etc/nix/nix.conf of the builder VM; tools/nix-builder/lima.yaml installs
# it there when the VM starts.
#
# Nix is used here for two things only: builds that see nothing but their
# declared inputs, and a store addressed by the hash of those inputs.

# Every build runs in an empty file system holding /nix/store paths of its
# inputs, with no network.  No fallback: a build that cannot be sandboxed
# fails, it does not run unsandboxed.
sandbox = true
sandbox-fallback = false

# Nothing of the guest inside the sandbox.  The one path a build sees
# besides the store is /bin/sh: make runs every recipe line with it, as
# does every program that calls system().  It is the seed's bash, in a
# store path of its own (nix/bootstrap/sh.nix; `nix-build /bunix/nix/bootstrap/sh.nix` prints
# this path, which is aarch64's).  It is not part of a derivation's hash, so it changes only
# together with the seed.  The `?` lets builds start while it is not in the
# store yet, as on a new VM; nix/tests/sandbox fails if it is missing or
# not the one nix/bootstrap/sh.nix builds.
# The compiler cache for Chromium's builds (docs/browser.md, "The
# compiler cache"), made by lima.yaml's provision; the `?` again, for a
# builder that has none.
sandbox-paths = /bin/sh=/nix/store/bx1q05b2c2kh3qzkldmri51cwgpnayg3-sh? /var/cache/ccache?

# Builds unpack and compile on the VM's disk.  Nix's default is /tmp, which
# on Debian is in memory and half the size of the VM's RAM: a gcc build
# does not fit.
build-dir = /nix/var/nix/builds

# No binary caches: the store fills only from what is built here.
substituters =

# The Nix language and nix-build, as they have been for years: no flakes,
# no `nix` subcommands.
experimental-features =

# Builds run as the nixbld users Debian's package created, never as root.
build-users-group = nixbld

# One derivation at a time, allowed every CPU of the VM ($NIX_BUILD_CORES;
# 0 means all).  Two at once would be two gcc builds' worth of compilers in
# the VM's 10 GiB.  Neither number is part of a derivation's hash.
max-jobs = 1
cores = 0
