# nix.conf for building on a bunix machine without installing anything:
# a static `nix` program and the store, both under the home directory.
# Nothing here needs root.
#
#   ~/nix-tool/nix        upstream's static nix; a tool, nothing of it
#                         enters the store
#   ~/nix-tool/bin/       nix-build, nix-store, nix-instantiate, nix-hash:
#                         links to ../nix, which acts by the name it is run as
#   ~/nix-tool/nix.conf   this file
#   ~/nix-root/nix/store  the store
#   ~/bunix/nix           the repository's nix/
#
# Setting it up:
#
#   1. the static nix: the "binary-dist" file of the job
#      buildStatic.nix-cli.x86_64-linux at hydra.nixos.org/jobset/nix/master,
#      saved as ~/nix-tool/nix and made executable
#   2. mkdir ~/nix-tool/bin; ln -s ../nix ~/nix-tool/bin/nix-build   (and the
#      other three names)
#   3. this file as ~/nix-tool/nix.conf, with the home directory below
#      changed if it is not /home/khaled
#   4. export NIX_CONF_DIR=~/nix-tool PATH=~/nix-tool/bin:$PATH
#   5. nix-build ~/bunix/nix/tests/sandbox/test.nix   (fails if /bin/sh below
#      is not right)
#
# `nix-build` leaves a `result` link to /nix/store/..., which does not exist
# on this machine; the file is under ~/nix-root.

# The one setting that is not in the builder VM's ../nix.conf.  The store
# is in ~/nix-root, and Nix makes it appear as /nix inside each build with
# a user namespace.  Store paths are /nix/store/... all the same, so every
# hash is what it would be with a real /nix.  nix.conf does not expand ~.
store = /home/khaled/nix-root

# The same as the VM's, where each is explained.
sandbox = true
sandbox-fallback = false
substituters =
experimental-features =
max-jobs = 1
cores = 0

# Not here, and why: build-users-group (there are no build users without
# root; a build runs as the user, in a user namespace) and build-dir (/tmp
# on bunix is large enough).

# /bin/sh for builds: nix/bootstrap/sh.nix, as in the VM, but by where the file
# really is on disk: under ~/nix-root, not the /nix/store/... path that
# `nix-build ~/bunix/nix/bootstrap/sh.nix` prints.  This is x86_64's.
sandbox-paths = /bin/sh=/home/khaled/nix-root/nix/store/dh5lv0hb5hvnk8zsdwhpihbjmv2m18ga-sh?
