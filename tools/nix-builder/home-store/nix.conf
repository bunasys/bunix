# nix.conf for building on a bunix machine without installing anything:
# a static `nix` program and the store, both under the home directory.
#
#   ~/nix-tool/nix        upstream's static nix (bin/ has nix-build etc. as
#                         links to it); a tool, nothing of it enters the store
#   ~/nix-tool/nix.conf   this file
#   ~/nix-root/nix/store  the store
#
#   export NIX_CONF_DIR=~/nix-tool PATH=~/nix-tool/bin:$PATH
#   nix-build ~/bunix/nix/stage1.nix -A gcc
#
# The settings are the builder VM's (../nix.conf), where each is explained.
# What differs:

# The store is in ~/nix-root, and Nix makes it appear as /nix inside each
# build with a user namespace.  Store paths are /nix/store/... all the
# same, so every hash is what it would be with a real /nix.
store = /home/khaled/nix-root

sandbox = true
sandbox-fallback = false
substituters =
experimental-features =
max-jobs = 1
cores = 0

# /bin/sh for builds: nix/sh.nix, by where it really is on disk.  This is
# x86_64's; `nix-build ~/bunix/nix/sh.nix` prints the store path.
sandbox-paths =
